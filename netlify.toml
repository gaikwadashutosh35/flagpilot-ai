[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Previews and branch deploys build with Flagsmith off, so they never send
# exposures or conversions into the real experiment. Production keeps the
# client key set in Netlify's UI.
[context.deploy-preview.environment]
  VITE_FLAGSMITH_ENVIRONMENT_KEY = ""

[context.branch-deploy.environment]
  VITE_FLAGSMITH_ENVIRONMENT_KEY = ""
